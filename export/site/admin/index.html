<!DOCTYPE html>
<html lang="en">

<head>
<style id="amz-inner-nofouc">
html{overflow-y:scroll;scrollbar-gutter:stable}
body:not(.home) .elementor-invisible,body:not(.home) .elementor-element.elementor-invisible,body:not(.home) .elementor-section.elementor-invisible,body:not(.home) .elementor-column.elementor-invisible,body:not(.home) .elementor-widget.elementor-invisible{visibility:visible!important;opacity:1!important;animation:none!important;-webkit-animation:none!important}
body:not(.home) #header .main-header,body:not(.home) #h-style-3.main-header{position:fixed!important;top:0!important;left:0!important;right:0!important;width:100%!important;z-index:10000!important;transform:none!important;visibility:visible!important;opacity:1!important;background-color:#ffffff!important;box-shadow:0 0 10px 0 rgb(0 0 0 / 15%)!important;height:81px!important;min-height:81px!important}
body:not(.home) #header .main-header .tx_logo:not(.tx_sticky_logo){display:none!important}
body:not(.home) #header .main-header .tx_logo.tx_sticky_logo{display:block!important}
body:not(.home) #page,body:not(.home) #page.tx-wrapper,body:not(.home) .tx-wrapper{padding-top:81px!important}
@media (max-width:991px){body:not(.home) #header .main-header,body:not(.home) #h-style-3.main-header{height:auto!important;min-height:64px!important}body:not(.home) #page,body:not(.home) #page.tx-wrapper,body:not(.home) .tx-wrapper{padding-top:64px!important}}
@media (max-width:767px){body:not(.home) #header .main-header,body:not(.home) #h-style-3.main-header{min-height:60px!important}body:not(.home) #page,body:not(.home) #page.tx-wrapper,body:not(.home) .tx-wrapper{padding-top:60px!important}}
body:not(.home) .elementor-section.elementor-section-stretched,body:not(.home) .elementor-section.elementor-section-full_width,body:not(.home) .forcefullwidth_wrapper_tp_banner,body:not(.home) .elementor-section-stretched > .elementor-container{left:0!important;right:0!important;width:100%!important;max-width:100%!important;margin-left:0!important;margin-right:0!important;transform:none!important;-webkit-transform:none!important}

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Sign in · CMS Admin</title>
  <link rel="stylesheet" href="admin.css" />
</head>

<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-mark"></div>
        <div>
          <h1>CMS Admin</h1>
          <p class="sub">Sign in to manage leads, posts, and pages</p>
        </div>
      </div>
      <form id="login-form">
        <label class="field-label" for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" />
        <div class="form-actions">
          <button class="btn btn-primary" type="submit" style="width:100%">Sign in</button>
        </div>
        <p id="error" class="hint" style="color:#b91c1c" hidden></p>
      </form>
    </div>
  </div>
  <script src="admin.js"></script>
  <script>
    if (Admin.getToken()) location.href = "app.html";
    document.getElementById("login-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      var err = document.getElementById("error");
      err.hidden = true;
      try {
        await Admin.login(document.getElementById("password").value);
        location.href = "app.html";
      } catch (ex) {
        err.textContent = ex.message || "Login failed";
        err.hidden = false;
      }
    });
  </script>
</body>

</html>
