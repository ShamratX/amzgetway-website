# ============================================================
# AmzGetway CMS Worker — connected to export/site
# ============================================================
# Remaining (your Cloudflare account):
#   1. cd backend/worker && npm install && npx wrangler login
#   2. npx wrangler d1 create amzgetway-cms-db
#   3. Paste database_id below, then:
#      npx wrangler d1 migrations apply amzgetway-cms-db --remote
#   4. npx wrangler secret put ADMIN_PASSWORD
#      npx wrangler secret put ADMIN_SECRET
#      npx wrangler secret put RESEND_API_KEY   (optional)
#   5. npm run deploy
# Full checklist: ../docs/00-setup-checklist.md
# ============================================================

name = "amzgetway-cms"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# After domain is on Cloudflare, uncomment:
# routes = [
#   { pattern = "amzgetway.com", custom_domain = true },
#   { pattern = "www.amzgetway.com", custom_domain = true },
# ]
routes = []

[assets]
# Website root (HTML + /admin + /assets + /cms) relative to this worker folder
directory = "../../export/site"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

[vars]
ALLOWED_ORIGINS = "http://127.0.0.1:8090,http://localhost:8090,http://127.0.0.1:8787,http://localhost:8787,https://amzgetway.com,https://www.amzgetway.com"
PUBLIC_SITE_URL = "https://amzgetway.com"
RECIPIENT_EMAIL = "amzexperts@amzgetway.com"
SENDER_EMAIL = "AMZgetway <amzexperts@amzgetway.com>"

# Optional — Publish to GitHub / media features (needs GITHUB_TOKEN secret)
GITHUB_REPO = "ShamratX/amzgetway-website"
GITHUB_BRANCH = "main"

# SECRETS (do NOT put real values here — use wrangler secret put):
#   ADMIN_PASSWORD
#   ADMIN_SECRET
#   RESEND_API_KEY
#   GITHUB_TOKEN   (optional)

[[d1_databases]]
binding = "DB"
database_name = "amzgetway-cms-db"
# Paste id from: npx wrangler d1 create amzgetway-cms-db
database_id = "336184a8-ff69-4a70-bd90-917d643a5c77"
migrations_dir = "migrations"
